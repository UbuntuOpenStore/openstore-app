clickable_minimum_required: 8.2.0
builder: cmake
kill: openstore
ignore_review_errors: true
dependencies_target:
  - libpam0g-dev
  - qt6-base-dev
  - qt6-declarative-dev
  - qt6-webengine-dev
  - libpackagekitqt6-dev
  - libappstreamqt-dev
  - libxapian-dev
install_lib:
  - /usr/lib/${ARCH_TRIPLET}/libsoup-*.so*
  - /usr/lib/${ARCH_TRIPLET}/libpackagekitqt*.so*
  - /usr/lib/${ARCH_TRIPLET}/libAppStreamQt*.so*
scripts:
  format: ./scripts/format.sh
  check: ./scripts/check.sh
  lint-qml: ./scripts/lint-qml.sh
skip_review: true
framework: ubuntu-touch-26.04-1.x
build_args: "-DENABLE_DEB_SUPPORT=ON -DENABLE_CLICK_SUPPORT=OFF -DENABLE_SNAP_SUPPORT=OFF"
build_dir: "./build/deb/${ARCH_TRIPLET}"
